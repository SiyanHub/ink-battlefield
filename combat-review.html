<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>墨绘战场 · 打击感检视</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2efe6;color:#333f47;font:14px system-ui}canvas{display:block}header{position:fixed;top:16px;left:20px;right:20px;padding:14px 18px;background:#faf7eced;border:1px solid #aca99c;border-radius:8px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}h1{font-size:19px;margin:0 10px 0 0}select,button{font:inherit;padding:7px 10px;background:#fffdf5;border:1px solid #a5aaab;border-radius:4px;color:inherit;cursor:pointer}button.active{background:#dceaf2;border-color:#1977bd}.hint{flex-basis:100%;margin:0;color:#5c676c;font-size:12px}footer{position:fixed;left:20px;bottom:16px;max-width:760px;background:#faf7ecef;border:1px solid #b9b5aa;border-radius:6px;padding:12px 16px}#status{font-size:16px;margin:0 0 7px}pre{font:11px/1.45 ui-monospace,monospace;margin:0;max-height:155px;overflow:auto;white-space:pre-wrap}#crosshair{position:fixed;left:50%;top:50%;width:5px;height:5px;border:1px solid #35495a;border-radius:50%;display:none;pointer-events:none}@media(max-width:800px){header{left:10px;right:10px;padding:10px}footer{left:10px;right:10px}h1{flex-basis:100%}}
</style></head><body><canvas id="scene"></canvas><div id="crosshair"></div><header><h1>打击感 / 真实仿真检视</h1><select id="weapon" aria-label="武器"></select><select id="camera" aria-label="观察角度"><option value="side">侧视 · 弹道与死亡</option><option value="close">近看目标 · 命中与倾倒</option><option value="first">第一人称 · 后坐与枪口</option></select><select id="speed" aria-label="播放速度"><option value=".25">0.25× 慢放</option><option value="1">1× 正常</option></select><button id="fire">单次扳机</button><button id="defeat">连续射击至击倒</button><button id="play">播放</button><button id="step">下一帧 1/60s</button><button id="reset">重置场景</button><select id="stop" aria-label="自动暂停"><option value="death">死亡发生时暂停</option><option value="hit">首次命中时暂停</option><option value="projectile">弹体出现时暂停</option><option value="none">不自动暂停</option></select><p class="hint">所有弹体、命中与死亡均来自正式 Simulation 的真实输入和 Renderer；切换武器会重置。暂停时点“下一帧”观察动作。此页仅开发使用，不写档、不进入生产构建。</p></header><footer><p id="status"></p><pre id="events"></pre></footer><script type="module" src="/src/combat-review.ts"></script></body></html>
