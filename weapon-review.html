<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>画具造型检视</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f0e6;color:#514f49;font:14px system-ui}header{height:90px;padding:14px 26px;display:flex;gap:18px;align-items:center;border-bottom:1px solid #514f49}h1{font-size:20px}select,button{padding:8px;background:#f4f0e6;color:#514f49;border:1px solid #514f49}#stage{height:calc(100vh - 90px);position:relative}canvas{width:100%;height:100%;display:block}#labels{position:absolute;inset:0;pointer-events:none;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr)}#labels span{padding:12px 18px;font-size:15px}#note{position:absolute;left:24px;bottom:15px;font-size:12px}#cross{position:absolute;left:50%;top:50%;display:none}#cross:after{content:'+'}</style></head>
<body><header><h1>画具造型检视</h1><select id="view" aria-label="检视方式"><option value="gallery">全部画具轮廓总览</option><option value="first">第一人称持握</option></select><select id="weapon" aria-label="画具"></select><select id="action" aria-label="动作"><option value="idle">待机</option><option value="fire">射击 / 挥击</option><option value="reload">换弹</option><option value="charge">蓄力</option></select><span>暖纸 · 石墨 · 少量蓝色线稿</span></header><div id="stage"><canvas></canvas><div id="labels"></div><span id="cross"></span><div id="note">开发检视页：与游戏共用模型和持握模块。总览不含手臂。<output id="resources"></output></div></div><script type="module" src="/src/weapon-review.ts"></script></body></html>
